packages:
  - "packages/*"
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
packageManagerStrictVersion: true
verifyStoreIntegrity: true
allowBuilds:
  "@prisma/client@6.9.0": true
  "@prisma/engines@6.9.0": true
  "esbuild@0.25.12": true
  "prisma@6.9.0": true
  "@firebase/util@1.12.0": false
  "@parcel/watcher@2.5.1": false
  "protobufjs@7.5.3": false
  "sharp@0.34.5": false
  "unrs-resolver@1.7.9": false
patchedDependencies:
  vite-plugin-storybook-nextjs@3.3.0: patches/vite-plugin-storybook-nextjs@3.3.0.patch
